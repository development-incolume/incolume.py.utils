[tox]
envlist =
    py27,
    py32,
    py33,
    py35,
    py37,
    pypy,
    flake8


[testenv]
deps =
    deprecated
    coverage == 3.7.1
commands = coverage run -a setup.py test


[flake8]
ignore =
max-line-length = 79
max-complexity = 5


[testenv:flake8]
deps =
    flake8
    py3kwarn
; comandos para testes
commands =
    flake8 .
    py3kwarn .
